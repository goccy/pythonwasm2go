name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify python-wasm attestations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify wasm2go bundle (release diff + attestation)
        # Authenticate the attestation-API fetch so it isn't rate limited
        # (anonymous api.github.com is 60 req/hr per IP and 403s on shared
        # runners). The offline `gh attestation verify` stays tokenless.
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: make verify

  build:
    name: Go build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
